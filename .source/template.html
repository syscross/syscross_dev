<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysCross</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bar-height: 56px;
            --bar-bg: #0d1117;
            --bar-fg: #ffffff;
            --bar-line: #30363d;
            --drawer-width: min(80vw, 300px);
            --page-bg: #ffffff;
        }
        @media (prefers-color-scheme: dark) {
            :root { --page-bg: #0d1117; }
        }
        body {
            margin: 0;
            background-color: var(--page-bg);
        }
        .markdown-body, .markdown-body pre, .markdown-body code, .markdown-body tt {
            font-family: "Noto Sans Mono CJK JP", "Noto Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        /* 상단바: 왼쪽 햄버거 · 가운데 SysCross · 오른쪽 햄버거 */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--bar-height);
            display: grid;
            grid-template-columns: var(--bar-height) 1fr var(--bar-height);
            align-items: center;
            box-sizing: border-box;
            background-color: var(--bar-bg);
            color: var(--bar-fg);
            border-bottom: 1px solid var(--bar-line);
            z-index: 30;
        }
        .topbar .brand {
            color: var(--bar-fg);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-align: center;
            text-decoration: none;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--bar-height);
            height: var(--bar-height);
            padding: 0;
            border: 0;
            background: none;
            color: var(--bar-fg);
            cursor: pointer;
        }
        /* 회전 각도는 JS가 열린 정도(0~90도)에 맞춰 직접 지정 */
        .menu-btn svg {
            transition: transform 0.28s ease;
        }

        /* 좌우 서랍 메뉴: 상단바와 하단바 사이에서만 열림 (내용은 비워 둠) */
        /* 위치는 JS가 손가락 움직임에 맞춰 직접 지정 */
        .drawer {
            position: fixed;
            top: var(--bar-height);
            bottom: var(--bar-height);
            width: var(--drawer-width);
            box-sizing: border-box;
            background-color: var(--bar-bg);
            color: var(--bar-fg);
            overflow-y: auto;
            transition: transform 0.28s ease;
            z-index: 40;
        }
        .drawer-left {
            left: 0;
            transform: translateX(-100%);
            box-shadow: 4px 0 16px rgba(0, 0, 0, 0.25);
        }
        .drawer-right {
            right: 0;
            transform: translateX(100%);
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        }

        /* 서랍 안의 목록: 인덱스(좌)와 TOC(우) */
        .drawer-list {
            margin: 0;
            padding: 12px;
            list-style: none;
        }
        .drawer-list li + li {
            margin-top: 2px;
        }
        .drawer-list a {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: inherit;
            font-size: 15px;
            text-decoration: none;
        }
        .drawer-list a:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .drawer-list li.sub a {
            padding-left: 24px;
            color: #c9d1d9;
        }
        .drawer-toc a {
            font-size: 14px;
            color: #c9d1d9;
        }
        /* 제목 링크를 눌렀을 때 제목이 상단바에 가려지지 않게 */
        .markdown-body h2 {
            scroll-margin-top: calc(var(--bar-height) + 12px);
            border-bottom: 0;
            font-size: 1.25em;
        }

        .scrim {
            position: fixed;
            top: var(--bar-height);
            bottom: var(--bar-height);
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
            z-index: 35;
        }

        /* 끌고 있는 동안에는 애니메이션 없이 손가락을 따라감 */
        body.dragging .drawer,
        body.dragging .scrim,
        body.dragging .menu-btn svg {
            transition: none;
        }

        /* 카드: 이미지 위, 하단 라벨 */
        .card {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 16 / 10;
            margin: 12px auto;
            border: 1px solid var(--bar-line);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--bar-bg);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        }
        /* 사진 칸: 확대되어 넘치는 부분은 칸 밖으로 나가지 않도록 잘라 냄 */
        .card-photo {
            display: block;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }
        .card img {
            display: block;
            width: 100%;
            height: 100%;
            /* 로드 전·실패 시 alt 글씨가 비치지 않도록 숨김 */
            color: transparent;
            font-size: 0;
            object-fit: cover;
            object-position: 50% 0%;
            /* 확대하면서 오른쪽 여백을 약간 잘라 냄 */
            transform: scale(1.15);
            transform-origin: 35% 0%;
        }
        .card-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 16px;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        /* 뷰 전환: hidden 속성이 항상 우선 적용되도록 */
        [hidden] { display: none !important; }

        /* 섹션 보기일 때 나오는 상단 하위 바: < 삶과 철학 */
        .subbar {
            position: fixed;
            top: calc(var(--bar-height) + 8px);
            left: 0;
            right: 0;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 2px;
            box-sizing: border-box;
            padding: 0 6px;
            background-color: var(--bar-bg);
            color: #6fa8d6;
            z-index: 28;
        }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            background: none;
            color: #6fa8d6;
            cursor: pointer;
        }
        .empty-list {
            margin: 0;
            padding: 24px 0;
            color: #8b949e;
            font-size: 14px;
            text-align: center;
        }
        /* 카테고리 바 전체가 메인으로 가는 링크: 밑줄과 색 변화 없이 한 덩어리로 동작 */
        .markdown-body a.subbar,
        .markdown-body a.subbar:hover,
        .markdown-body a.subbar:focus {
            text-decoration: none;
            color: #6fa8d6;
        }
        .subbar-title {
            padding: 0;
            border: 0;
            background: none;
            color: #6fa8d6;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }
        html.section-view .content {
            padding-top: calc(var(--bar-height) + 44px);
        }
        /* 하위 바가 있는 화면에서는 본문 위쪽 여백을 없애서 내용이 하위 바 바로 아래에 오도록 */
        html.section-view .markdown-body {
            padding-top: 0;
        }
        /* 목록 화면: 메인 카드는 숨기고, 하위 바와 목록은 보이게 (hidden 속성이 바뀌기 전에도 동일하게) */
        html.section-view .card {
            display: none !important;
        }
        html.section-view .subbar[hidden] {
            display: flex !important;
        }
        html.section-view .section-list[hidden] {
            display: block !important;
        }
        /* 아티클 화면: 제목 영역이 가로·상단까지 꽉 차고, 뒤로 바는 제목 아래 흐름에 놓이며, 본문은 그 아래에서 시작 */
        body.article-view .content {
            padding-top: 0;
        }
        /* 폭은 100vw 대신 화면 실제 폭(자동)을 써서 세로 스크롤바 너비만큼 밀리지 않게 함 */
        body.article-view .markdown-body {
            max-width: none;
            margin: 0;
            padding: 0 0 45px;
        }
        body.article-view .markdown-body .hero {
            width: auto;
            margin: 0;
            border-radius: 0;
            padding: calc(var(--bar-height) + 56px) 24px 56px;
        }
        /* 아티클 뒤로 바: 흰색, 「< 현재 아티클 제목」 */
        body.article-view .markdown-body .subbar {
            color: #ffffff;
        }
        body.article-view .markdown-body .subbar .back-btn {
            color: #6fa8d6;
        }
        .article-crumb {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }
        /* 카드 전체가 링크: 어디를 눌러도 동작하고, 글자 밑줄은 나오지 않음 (마크다운 기본 :hover 밑줄 차단) */
        .markdown-body a.card,
        .markdown-body a.card:hover,
        .markdown-body a.card:focus,
        .markdown-body a.thin-card,
        .markdown-body a.thin-card:hover,
        .markdown-body a.thin-card:focus {
            text-decoration: none;
            color: inherit;
        }
        /* 본문 안 링크는 마크다운 기본 스타일(:hover 밑줄)이 우선하므로, 더 구체적인 선택자로 밑줄을 끔 */
        .markdown-body .article-crumb .crumb-parent,
        .markdown-body .article-crumb .crumb-parent:hover,
        .markdown-body .article-crumb .crumb-parent:focus {
            color: #6fa8d6;
            text-decoration: none;
            padding: 8px 0;
        }
        .article-crumb .crumb-sep {
            display: inline-flex;
            vertical-align: middle;
            margin: 0 4px;
        }
        body.article-view .markdown-body .subbar {
            position: relative;
            top: auto;
            left: auto;
            right: auto;
            width: auto;
            height: 36px;
            margin: 0 0 12px;
            padding: 0 12px;
        }
        body.article-view .markdown-body > *:not(.hero):not(.subbar) {
            box-sizing: border-box;
            max-width: 980px;
            margin-left: auto;
            margin-right: auto;
            padding: 0 24px;
        }

        /* 섹션 리스트: 카테고리 카드보다 얇은 카드, 우측 정렬 */
        .section-list {
            max-width: 420px;
            margin: 12px auto 24px;
        }
        .thin-list {
            display: grid;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        /* 본문 안의 목록은 마크다운 스타일(왼쪽 들여쓰기)이 적용되므로 더 구체적으로 덮어씀 */
        .markdown-body .thin-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .markdown-body .thin-list > li + li {
            margin-top: 0;
        }
        .thin-card {
            display: flex;
            color: inherit;
            text-decoration: none;
            align-items: center;
            gap: 14px;
            box-sizing: border-box;
            height: 84px;
            padding: 8px 14px 8px 8px;
            border: 1px solid var(--bar-line);
            border-radius: 12px;
            background-color: var(--bar-bg);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }
        .thin-thumb {
            display: block;
            flex: none;
            width: 68px;
            height: 68px;
            border-radius: 10px;
            object-fit: cover;
        }
        .thin-text {
            flex: 1;
            min-width: 0;
            text-align: right;
        }
        .thin-ko {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
        }
        .thin-en {
            margin-top: 4px;
            color: #8b949e;
            font-size: 11px;
            letter-spacing: 0.04em;
        }
        .card-label .label-ko {
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
        }
        .card-label .label-en {
            color: #8b949e;
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        /* 제목 영역(hero): 사진을 배경으로 깔고 어둡게 덮어 글씨가 잘 보이게 함, 주제·부제는 가운데 정렬 */
        .markdown-body .hero {
            position: relative;
            overflow: hidden;
            margin: 0 0 24px;
            padding: 64px 24px;
            border-radius: 12px;
            text-align: center;
            color: #ffffff;
            background-image: var(--hero-image);
            background-size: cover;
            background-position: var(--hero-position, center);
        }
        .markdown-body .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .markdown-body .hero h1,
        .markdown-body .hero h2 {
            position: relative;
            margin: 0;
            padding: 0;
            border: 0;
            color: #ffffff;
        }
        .markdown-body .hero h1 {
            font-size: 26px;
        }
        .markdown-body .hero h2 {
            margin-top: 12px;
            font-size: 18px;
            font-weight: 400;
            color: #e6edf3;
        }
        .markdown-body .hero p {
            position: relative;
            margin: 12px 0 0;
            font-size: 14px;
            color: #8b949e;
        }
        @media (max-width: 767px) {
            .markdown-body .hero { padding: 40px 16px; }
            .markdown-body .hero h1 { font-size: 22px; }
        }

        /* 본문: 상단바와 하단바 사이 영역 */
        .content {
            padding-top: var(--bar-height);
        }
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            font-size: 14px;
        }
        @media (max-width: 767px) {
            .markdown-body { padding: 15px; }
        }
    </style>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        mermaid.initialize({ startOnLoad: true, theme: isDark ? "dark" : "default" });
        window.addEventListener("DOMContentLoaded", () => {
            if (window.hljs) hljs.highlightAll();
            if (window.renderMathInElement) renderMathInElement(document.body);
        });
    </script>
    <script defer>
        window.addEventListener("DOMContentLoaded", () => {
            const body = document.body;
            const drawerL = document.querySelector(".drawer-left");
            const drawerR = document.querySelector(".drawer-right");
            const scrim = document.querySelector(".scrim");
            const iconL = document.querySelector('.menu-btn[data-open="left"] svg');
            const iconR = document.querySelector('.menu-btn[data-open="right"] svg');

            // s: +1 = 왼쪽 서랍 완전히 열림, -1 = 오른쪽 서랍 완전히 열림, 0 = 닫힘, 사이값 = 열린 정도
            let s = 0;
            const clamp = (v) => Math.max(-1, Math.min(1, v));
            const drawerWidth = () => Math.min(window.innerWidth * 0.8, 300);

            const apply = (value) => {
                s = value;
                const l = Math.max(0, s);
                const r = Math.max(0, -s);
                drawerL.style.transform = `translateX(${(l - 1) * 100}%)`;
                drawerR.style.transform = `translateX(${(1 - r) * 100}%)`;
                scrim.style.opacity = Math.max(l, r) * 0.4;
                scrim.style.pointerEvents = s === 0 ? "none" : "auto";
                // 왼쪽: 열 때 반시계 최대 90도, 오른쪽: 열 때 시계 최대 90도
                iconL.style.transform = `rotate(${-90 * l}deg)`;
                iconR.style.transform = `rotate(${90 * r}deg)`;
            };

            // 버튼을 누르면 해당 쪽을 열거나, 이미 열려 있으면 닫음
            let justDragged = false;
            document.querySelectorAll(".menu-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    if (justDragged) return;
                    if (btn.dataset.open === "left") apply(s > 0 ? 0 : 1);
                    else apply(s < 0 ? 0 : -1);
                });
            });
            scrim.addEventListener("click", () => apply(0));
            // 서랍 안의 링크를 누르면 서랍을 닫고 이동
            // 목차(우측) 링크는 본문 영역 안에서 해당 제목으로 스크롤 (본문이 별도 스크롤 영역이라 직접 처리)
            document.querySelectorAll(".drawer a").forEach((a) => {
                a.addEventListener("click", (e) => {
                    apply(0);
                    if (!a.closest(".drawer-toc")) return;
                    e.preventDefault();
                    const target = document.getElementById(a.getAttribute("href").slice(1));
                    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            });
            document.addEventListener("keydown", (e) => { if (e.key === "Escape") apply(0); });

            // 터치를 유지한 채 끌면 서랍이 손가락을 따라감. 손을 떼면 절반을 넘었는지로 열림/닫힘 결정
            // 코드·표처럼 가로 스크롤되는 곳에서 시작한 터치는 무시
            let drag = null;

            window.addEventListener("touchstart", (e) => {
                const t = e.target;
                if (!t.closest(".menu-btn") && t.closest("pre, table")) { drag = null; return; }
                // 열린 서랍이 있으면 그 서랍을 닫는 방향으로만 움직임 (반대쪽 서랍으로 바로 넘어가지 않음)
                const lo = s > 0 ? 0 : -1;
                const hi = s < 0 ? 0 : 1;
                drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, s0: s, lo, hi, active: false, samples: [] };
            }, { passive: true });

            window.addEventListener("touchmove", (e) => {
                if (!drag) return;
                const dx = e.touches[0].clientX - drag.x;
                const dy = e.touches[0].clientY - drag.y;
                if (!drag.active) {
                    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) { drag = null; return; }  // 세로 스크롤로 판단
                    if (Math.abs(dx) < 8) return;
                    drag.active = true;
                    body.classList.add("dragging");
                }
                if (e.cancelable) e.preventDefault();
                drag.samples.push({ x: e.touches[0].clientX, t: performance.now() });
                if (drag.samples.length > 10) drag.samples.shift();
                apply(Math.max(drag.lo, Math.min(drag.hi, drag.s0 + dx / drawerWidth())));
            }, { passive: false });

            // 관성: 손을 뗀 순간의 속도로 도달할 지점을 예측하고, 가장 가까운 상태(왼쪽 열림 / 닫힘 / 오른쪽 열림)로 정함
            const FLICK_MS = 250;
            const endDrag = () => {
                if (!drag) return;
                const { active, samples, lo, hi } = drag;
                drag = null;
                if (!active) return;
                justDragged = true;
                setTimeout(() => { justDragged = false; }, 0);

                // 최근 100ms 안의 샘플로 속도 계산 (서랍 폭 기준 비율/ms)
                const now = performance.now();
                const recent = samples.filter((p) => now - p.t <= 100);
                let velocity = 0;
                if (recent.length >= 2) {
                    const first = recent[0];
                    const last = recent[recent.length - 1];
                    if (last.t > first.t) velocity = (last.x - first.x) / (last.t - first.t) / drawerWidth();
                }

                // 삼단구조: 왼쪽 열림(1) ↔ 본문(0) ↔ 오른쪽 열림(-1)
                // 튕긴 방향으로 한 단계만 이동하고, 천천히 놓은 경우에는 놓은 자리에 그대로 둠
                const flick = velocity * FLICK_MS;
                let target;
                if (Math.abs(flick) > 0.15) {
                    if (flick > 0) target = s < 0 ? 0 : 1;
                    else target = s > 0 ? 0 : -1;
                } else {
                    // 천천히 놓으면 열림/닫힘 중 가까운 쪽으로 감
                    target = [-1, 0, 1]
                        .filter((v) => v >= lo && v <= hi)
                        .reduce((a, b) => (Math.abs(b - s) < Math.abs(a - s) ? b : a));
                }
                body.classList.remove("dragging");
                requestAnimationFrame(() => apply(target));
            };
            window.addEventListener("touchend", endDrag, { passive: true });
            window.addEventListener("touchcancel", endDrag, { passive: true });

            apply(0);

        });
    </script>
</head>

    </button>

    </button>
