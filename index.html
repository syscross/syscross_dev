<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysCross</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            cursor: none; 
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .sys-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.04);
            user-select: none;
            font-weight: bold;
        }
        .sys-text {
            font-size: 3.5rem;
            letter-spacing: 1rem;
            margin-bottom: -2rem;
            margin-right: -1rem; 
        }
        .x-text {
            font-size: 18rem;
            line-height: 1;
        }
        .cursor-core {
            width: 3px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        .trail-dot {
            position: fixed;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="sys-logo">
        <div class="sys-text">SYS</div>
        <div class="x-text">X</div>
    </div>
    
    <div class="cursor-core" id="cursor-core"></div>

    <script>
        const core = document.getElementById('cursor-core');
        
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let dots = [];
        const DOT_COUNT = 25;

        for(let i = 0; i < DOT_COUNT; i++) {
            let d = document.createElement('div');
            d.className = 'trail-dot';
            
            let ratio = 1 - (i / DOT_COUNT);
            d.style.width = (ratio * 8) + 'px';
            d.style.height = (ratio * 8) + 'px';
            d.style.opacity = ratio * 0.4;
            
            document.body.appendChild(d);
            dots.push({ x: mouse.x, y: mouse.y, el: d });
        }

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            core.style.left = mouse.x + 'px';
            core.style.top = mouse.y + 'px';
        });

        function animate() {
            dots[0].x += (mouse.x - dots[0].x) * 0.6;
            dots[0].y += (mouse.y - dots[0].y) * 0.6;
            
            for(let i = 1; i < DOT_COUNT; i++) {
                dots[i].x += (dots[i-1].x - dots[i].x) * 0.45;
                dots[i].y += (dots[i-1].y - dots[i].y) * 0.45;
            }
            
            for(let i = 0; i < DOT_COUNT; i++) {
                dots[i].el.style.left = dots[i].x + 'px';
                dots[i].el.style.top = dots[i].y + 'px';
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
