<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysCross</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            cursor: none; 
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            position: relative;
        }
        
        ::selection {
            background: rgba(0, 255, 204, 0.3);
            color: #ffffff;
        }
        ::-moz-selection {
            background: rgba(0, 255, 204, 0.3);
            color: #ffffff;
        }

        .sys-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #050505; /* 극한의 심연 다크 모드 */
            pointer-events: none; 
            user-select: none;
            z-index: -1; 
            font-family: 'Arial Black', Impact, sans-serif;
        }
        .sys-text {
            font-size: 4rem;
            letter-spacing: 1.2rem;
            margin-right: -1.2rem; 
            margin-bottom: -1rem; 
        }
        .x-text {
            font-size: 13rem; 
            line-height: 0.9;
            transform: scaleX(1.15); 
        }
        
        #wm-root {
            position: absolute;
            top: 15px; bottom: 15px; left: 15px; right: 15px;
            display: flex;
            z-index: 10;
        }
        
        .tile-container {
            display: flex;
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
        }
        .tile-container.row { flex-direction: row; }
        .tile-container.col { flex-direction: column; }
        
        .tile-cell {
            flex: 1 1 0%;
            min-width: 0;
            min-height: 0;
            position: relative;
        }
        
        /* 바깥 창틀의 여백(Padding)을 제거하여 드래그 데드존 원천 차단 */
        .tile-window {
            position: absolute;
            top: 5px; bottom: 5px; left: 5px; right: 5px;
            background-color: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9), 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 테두리 바깥으로 나가는 요소들 칼같이 차단 */
            transition: border-color 0.1s, background-color 0.1s;
        }
        
        .tile-cell:hover .tile-window, .tile-cell:focus-within .tile-window {
            border-color: rgba(255, 255, 255, 0.2);
            background-color: rgba(15, 15, 15, 0.7);
        }

        .tile-cell.targeted .tile-window {
            border-color: rgba(255, 50, 50, 0.8) !important;
            background-color: rgba(50, 10, 10, 0.6) !important;
            box-shadow: inset 0 0 30px rgba(255, 0, 0, 0.2) !important;
            transform: scale(0.98);
        }

        body.is-drag-selecting .tile-cell:not(.drag-origin) * {
            user-select: none !important;
        }

        /* 여백(Padding)을 내부 컨테이너로 이동시켜 전체를 텍스트 활성 구역으로 만듦 */
        .term-wrapper {
            width: 100%;
            height: 100%;
            display: block; 
            overflow-y: auto;
            overflow-x: hidden;
            color: #ccc;
            font-size: 0.9rem;
            padding: 12px; 
            user-select: text; 
        }
        .term-wrapper::-webkit-scrollbar { width: 4px; }
        .term-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

        .term-line { 
            margin-bottom: 4px; 
            word-break: break-all; 
            white-space: pre-wrap; 
            user-select: text; 
        }
        
        .term-input-line {
            display: flex;
            color: #fff;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        
        .prompt { 
            color: #00ffcc; 
            margin-right: 8px; 
            white-space: nowrap; 
            font-weight: bold; 
            user-select: none; 
        }
        
        .term-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: inherit;
            flex: 1;
            min-width: 50px;
            outline: none;
        }

        .cursor-core {
            width: 3px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
            transition: background-color 0.1s, box-shadow 0.1s;
        }
        .cursor-core.destructive {
            background-color: #ff3232;
            box-shadow: 0 0 15px 4px rgba(255, 50, 50, 0.9);
        }

        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
        }
    </style>
</head>
<body>
    <div class="sys-logo">
        <div class="sys-text">SYS</div>
        <div class="x-text">X</div>
    </div>
    
    <div id="wm-root"></div>
    
    <canvas id="trail-canvas"></canvas>
    <div class="cursor-core" id="cursor-core"></div>

    <script>
        const core = document.getElementById('cursor-core');
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d');
        const wmRoot = document.getElementById('wm-root');
        
        const MIN_TILE_SIZE = 60;
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let points = [];
        const MAX_AGE = 25;

        let isLeftDragging = false;
        let isMiddleDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let fadingBoxes = [];
        let cancelNextContextMenu = false; 

        function createTile() {
            const cell = document.createElement('div');
            cell.className = 'tile-cell';
            
            const win = document.createElement('div');
            win.className = 'tile-window';

            const wrapper = document.createElement('div');
            wrapper.className = 'term-wrapper';
            
            const inputLine = document.createElement('div');
            inputLine.className = 'term-input-line';
            
            const prompt = document.createElement('span');
            prompt.className = 'prompt';
            prompt.innerText = '>'; 
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'term-input';
            input.autocomplete = 'off';
            input.spellcheck = false;
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = input.value.trim();
                    if (val) {
                        const cmd = val.split(/\s+/)[0]; 
                        
                        const echoDiv = document.createElement('div');
                        echoDiv.className = 'term-line';
                        echoDiv.innerHTML = '<span class="prompt">></span>' + val;
                        
                        const errDiv = document.createElement('div');
                        errDiv.className = 'term-line';
                        errDiv.style.color = '#ff5555';
                        errDiv.innerText = 'bash: ' + cmd + ': command not found';
                        
                        wrapper.insertBefore(echoDiv, inputLine);
                        wrapper.insertBefore(errDiv, inputLine);
                    }
                    input.value = '';
                    wrapper.scrollTop = wrapper.scrollHeight; 
                }
            });
            
            cell.addEventListener('click', () => {
                if (window.getSelection().toString() === '') {
                    input.focus();
                }
            });
            
            inputLine.appendChild(prompt);
            inputLine.appendChild(input);
            wrapper.appendChild(inputLine);
            win.appendChild(wrapper);
            cell.appendChild(win);
            
            setTimeout(() => input.focus(), 50);
            
            return cell;
        }

        function splitTile(targetCell, clientX, clientY) {
            const rect = targetCell.getBoundingClientRect();
            const ratio = rect.width / rect.height;
            
            const relX = clientX - rect.left;
            const relY = clientY - rect.top;
            
            const distTop = relY;
            const distBottom = rect.height - relY;
            const distLeft = relX;
            const distRight = rect.width - relX;
            const minDist = Math.min(distTop, distBottom, distLeft, distRight);

            let isRowSplit;
            let insertBefore;

            if (ratio > 1.5) {
                isRowSplit = true;
                insertBefore = (relX < rect.width / 2);
            } else if (ratio < 0.66) {
                isRowSplit = false;
                insertBefore = (relY < rect.height / 2);
            } else {
                if (minDist === distLeft) {
                    isRowSplit = true; insertBefore = true;
                } else if (minDist === distRight) {
                    isRowSplit = true; insertBefore = false;
                } else if (minDist === distTop) {
                    isRowSplit = false; insertBefore = true;
                } else {
                    isRowSplit = false; insertBefore = false;
                }
            }

            if (isRowSplit && (rect.width / 2) < MIN_TILE_SIZE) {
                if ((rect.height / 2) >= MIN_TILE_SIZE) {
                    isRowSplit = false;
                    insertBefore = (relY < rect.height / 2);
                } else {
                    return; 
                }
            } else if (!isRowSplit && (rect.height / 2) < MIN_TILE_SIZE) {
                if ((rect.width / 2) >= MIN_TILE_SIZE) {
                    isRowSplit = true;
                    insertBefore = (relX < rect.width / 2);
                } else {
                    return;
                }
            }

            const container = document.createElement('div');
            container.className = 'tile-container ' + (isRowSplit ? 'row' : 'col');
            container.style.flex = targetCell.style.flex || '1 1 0%';

            const newCell = createTile();
            
            targetCell.parentNode.replaceChild(container, targetCell);

            targetCell.style.flex = '1 1 0%';
            newCell.style.flex = '1 1 0%';

            if (insertBefore) {
                container.appendChild(newCell);
                container.appendChild(targetCell);
            } else {
                container.appendChild(targetCell);
                container.appendChild(newCell);
            }
        }

        function removeTile(cell) {
            const parent = cell.parentNode;
            
            if (parent.id === 'wm-root') {
                cell.remove(); 
                return;
            }
            
            const sibling = cell.nextElementSibling || cell.previousElementSibling;
            const grandParent = parent.parentNode;
            
            cell.remove();
            
            if (grandParent) {
                sibling.style.flex = parent.style.flex || '1 1 0%';
                grandParent.replaceChild(sibling, parent);
            }
        }

        function checkTargetedTiles(x1, y1, x2, y2) {
            const boxMinX = Math.min(x1, x2);
            const boxMaxX = Math.max(x1, x2);
            const boxMinY = Math.min(y1, y2);
            const boxMaxY = Math.max(y1, y2);

            document.querySelectorAll('.tile-cell').forEach(cell => {
                const rect = cell.getBoundingClientRect();
                const isIntersecting = !(boxMaxX < rect.left || boxMinX > rect.right || boxMaxY < rect.top || boxMinY > rect.bottom);
                
                if (isIntersecting) {
                    cell.classList.add('targeted');
                } else {
                    cell.classList.remove('targeted');
                }
            });
        }

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            
            if (cancelNextContextMenu) {
                cancelNextContextMenu = false;
                return;
            }
            
            const cell = e.target.closest('.tile-cell');
            
            if (cell) {
                splitTile(cell, e.clientX, e.clientY);
            } else if (wmRoot.children.length === 0) {
                const newCell = createTile();
                wmRoot.appendChild(newCell);
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (isMiddleDragging && (e.button === 0 || e.button === 2)) {
                isMiddleDragging = false;
                core.classList.remove('destructive');
                document.querySelectorAll('.tile-cell.targeted').forEach(cell => cell.classList.remove('targeted'));
                
                if (e.button === 2) cancelNextContextMenu = true;
                return;
            }

            if (e.button === 0) {
                isLeftDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                dragCurrent = { x: e.clientX, y: e.clientY };
                
                document.body.classList.add('is-drag-selecting');
                const cell = e.target.closest('.tile-cell');
                document.querySelectorAll('.tile-cell').forEach(c => c.classList.remove('drag-origin'));
                if (cell) {
                    cell.classList.add('drag-origin');
                }

            } else if (e.button === 1) {
                e.preventDefault();
                isMiddleDragging = true;
                dragStart = { x: e.clientX, y: e.clientY };
                dragCurrent = { x: e.clientX, y: e.clientY };
                
                core.classList.add('destructive');
                checkTargetedTiles(dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y);
            }
        });

        document.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            core.style.left = mouse.x + 'px';
            core.style.top = mouse.y + 'px';

            if (isLeftDragging) {
                dragCurrent = { x: e.clientX, y: e.clientY };
            } else if (isMiddleDragging) {
                dragCurrent = { x: e.clientX, y: e.clientY };
                checkTargetedTiles(dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y);
            }
        });

        document.addEventListener('mouseup', (e) => {
            const dragDist = Math.hypot(dragCurrent.x - dragStart.x, dragCurrent.y - dragStart.y);

            if (e.button === 0 && isLeftDragging) {
                isLeftDragging = false;
                document.body.classList.remove('is-drag-selecting');
                
                if (dragDist > 5) {
                    fadingBoxes.push({ ...dragStart, x2: dragCurrent.x, y2: dragCurrent.y, opacity: 1.0, r: 255, g: 255, b: 255 });
                }
            } else if (e.button === 1 && isMiddleDragging) {
                isMiddleDragging = false;
                core.classList.remove('destructive');
                
                const targetedCells = document.querySelectorAll('.tile-cell.targeted');
                
                if (dragDist > 5) {
                    Array.from(targetedCells).forEach(cell => removeTile(cell));
                    fadingBoxes.push({ ...dragStart, x2: dragCurrent.x, y2: dragCurrent.y, opacity: 1.0, r: 255, g: 50, b: 50 });
                } else {
                    Array.from(targetedCells).forEach(cell => removeTile(cell));
                }
            }
        });

        function drawBox(ctx, x1, y1, x2, y2, opacity, r, g, b) {
            const x = Math.min(x1, x2);
            const y = Math.min(y1, y2);
            const w = Math.abs(x2 - x1);
            const h = Math.abs(y2 - y1);
            
            ctx.fillStyle = 'rgba(' + r + ', ' + g + ', ' + b + ', ' + (0.1 * opacity) + ')';
            ctx.strokeStyle = 'rgba(' + r + ', ' + g + ', ' + b + ', ' + (0.4 * opacity) + ')';
            ctx.lineWidth = 1;
            
            ctx.fillRect(x, y, w, h);
            ctx.strokeRect(x, y, w, h);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isLeftDragging) {
                drawBox(ctx, dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y, 1.0, 255, 255, 255);
            } else if (isMiddleDragging) {
                drawBox(ctx, dragStart.x, dragStart.y, dragCurrent.x, dragCurrent.y, 1.0, 255, 50, 50);
            }
            
            for (let i = fadingBoxes.length - 1; i >= 0; i--) {
                let box = fadingBoxes[i];
                drawBox(ctx, box.x, box.y, box.x2, box.y2, box.opacity, box.r, box.g, box.b);
                box.opacity -= 0.04; 
                if (box.opacity <= 0) fadingBoxes.splice(i, 1);
            }

            points.push({ x: mouse.x, y: mouse.y, age: 0 });
            points.forEach(p => p.age += 1);
            points = points.filter(p => p.age <= MAX_AGE);

            if (points.length > 1) {
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const ratio = 1 - (p1.age / MAX_AGE);
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    
                    ctx.lineCap = 'butt'; 
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = ratio * 5;
                    
                    if (isMiddleDragging) {
                        ctx.strokeStyle = 'rgba(255, 100, 100, ' + (ratio * 0.6) + ')';
                    } else {
                        ctx.strokeStyle = 'rgba(255, 255, 255, ' + (ratio * 0.4) + ')';
                    }
                    ctx.shadowBlur = 0; 
                    
                    ctx.stroke();
                }
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
